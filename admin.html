<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>超级管理员 · 智慧矿山</title><link rel="stylesheet" href="css/style.css"><style>body.admin-page{background:#07131d;color:#e8f2f5;font-family:Arial,"Microsoft YaHei",sans-serif;margin:0}.admin-shell{max-width:1180px;margin:0 auto;padding:28px 22px}.admin-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #25404b;padding-bottom:18px}.admin-head h1{font-size:24px;margin:0}.admin-head p{color:#91aab3;margin:8px 0 0}.admin-actions{display:flex;gap:10px}.admin-btn{border:1px solid #326171;background:#102b36;color:#dffaff;padding:9px 14px;border-radius:5px;cursor:pointer}.admin-btn.primary{background:#0c879b;border-color:#1ec8dc}.admin-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;margin-top:20px}.admin-panel{background:#0c202a;border:1px solid #203e49;padding:18px;border-radius:6px}.admin-panel h2{font-size:16px;margin:0 0 14px}.admin-table{width:100%;border-collapse:collapse;font-size:13px}.admin-table th,.admin-table td{padding:10px 8px;border-bottom:1px solid #1d3943;text-align:left}.admin-table th{color:#8eabb4;font-weight:500}.admin-table select,.admin-panel input{background:#081923;color:#e8f2f5;border:1px solid #2b5360;padding:8px;border-radius:4px;width:100%;box-sizing:border-box}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.form-row.full{grid-template-columns:1fr}.form-actions{display:flex;justify-content:flex-end}.admin-status{min-height:22px;color:#82e4bd;margin:8px 0}.admin-status.error{color:#ff9a8f}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.admin-head{align-items:flex-start;gap:12px;flex-direction:column}.admin-table{font-size:12px}}</style></head><body class="admin-page"><main class="admin-shell"><header class="admin-head"><div><h1>超级管理员中心</h1><p>账户、角色与审计日志</p></div><div class="admin-actions"><button class="admin-btn" id="refreshBtn">刷新</button><button class="admin-btn" id="logoutBtn">退出登录</button></div></header><div id="status" class="admin-status"></div><section class="admin-grid"><div class="admin-panel"><h2>用户账户</h2><div id="usersWrap">正在读取...</div></div><div class="admin-panel"><h2>创建账户</h2><form id="createForm"><div class="form-row full"><input name="username" type="email" placeholder="登录邮箱" required></div><div class="form-row"><input name="displayName" placeholder="显示名称" required><input name="organization" placeholder="所属组织"></div><div class="form-row"><input name="password" type="password" minlength="8" placeholder="初始密码（至少 8 位）" required><select name="role"><option value="enterprise">企业端</option><option value="regulator">监管端</option><option value="expert">智库端</option><option value="viewer" selected>只读用户</option></select></div><div class="form-actions"><button class="admin-btn primary" type="submit">创建账户</button></div></form></div><div class="admin-panel"><h2>最近审计日志</h2><div id="logsWrap">正在读取...</div></div></section></main><script type="module" src="js/admin.js"></script></body></html>
